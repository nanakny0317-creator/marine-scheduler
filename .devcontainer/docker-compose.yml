version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: .devcontainer/Dockerfile
    volumes:
      - ..:/workspace:cached
      - node_modules:/workspace/node_modules  # ホストの Windows ビルドと混在しないよう分離
    command: sleep infinity

volumes:
  node_modules:     # コンテナ内 node_modules（ホストと分離）
